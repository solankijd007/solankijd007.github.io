<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f1117"/>
      <stop offset="100%" stop-color="#040405"/>
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5eead4"/>
      <stop offset="100%" stop-color="#14b8a6"/>
    </linearGradient>

    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2dd4bf" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#2dd4bf" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#0d9488" stop-opacity="0.8"/>
    </linearGradient>
  </defs>

  <!-- Background Card -->
  <rect x="24" y="24" width="464" height="464" rx="108" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="14"/>

  <!-- Code Bracket Left < -->
  <path d="M 136 216 L 96 256 L 136 296" fill="none" stroke="url(#accentGrad)" stroke-width="20" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>

  <!-- Code Bracket Right > -->
  <path d="M 376 216 L 416 256 L 376 296" fill="none" stroke="url(#accentGrad)" stroke-width="20" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>

  <!-- Monogram JS -->
  <text x="256" y="296" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="900" font-size="140" fill="url(#accentGrad)" text-anchor="middle" letter-spacing="-3">JS</text>
</svg>
